<html lang="en">
<head>

<style>
:root{--bg:#f7f5e9;--paper:#fffdf5;--sage:#dfe8d4;--green:#456b43;--deep:#284a2d;--gold:#c9a44d;--ink:#314334;--line:#e4e4d2;--muted:#71816e;--font:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:var(--font)/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:11px 14px;background:var(--green);color:white}button.secondary{background:var(--sage);color:var(--deep);border:1px solid var(--line)}button.ghost{background:transparent;color:var(--green);padding:7px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fffef9;color:var(--ink)}textarea{min-height:100px;resize:vertical}.app{max-width:520px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 14px calc(82px + env(safe-area-inset-bottom));}.header{display:flex;align-items:center;gap:10px;padding:12px 2px 16px}.logo{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff9d7,#d9e7cb);border:1px solid #d9c16e;font-size:29px}.brand{font-family:Georgia,serif;font-style:italic;font-size:25px;color:var(--green);line-height:1.05}.tagline{font-size:.78em;color:var(--muted)}.grow{flex:1}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 3px 12px #435c3510}.hero{background:linear-gradient(140deg,#eef2df,#fff9e9);padding:20px;border-radius:22px;border:1px solid var(--line)}h1{font-size:1.45em;margin:4px 0 8px}h2{font-size:1.18em;margin:0 0 10px}h3{font-size:1em;margin:0 0 8px}.muted{color:var(--muted);font-size:.88em}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f4f3e5;border-radius:14px;text-align:center;padding:12px 4px}.stat b{display:block;font-size:1.25em;color:var(--green)}.tabs{display:flex;gap:7px;overflow:auto;padding:6px 0}.tabs button{white-space:nowrap;padding:8px 12px;font-size:.85em}.tabs button.active{background:var(-- .stat-single{display:grid;grid-template-columns:1fr;gap:10px}.stat-single .stat{max-width:100%}
</style></head>
<body><div class="app">
<header class="header"><div class="logo">🌻</div><div><div class="brand">My Daily</div><div class="tagline">Your Life, Your Time</div></div><div class="grow"></div><button class="ghost" onclick="go('settings')" aria-label="Settings">⚙️</button></header>
<main id="view"></main>
<nav class="bottom" id="nav">
<button data-page="home" onclick="go('home')"><span>⌂</span><b data-i="home">Your Life</b></button>
<button data-page="daily" onclick="go('daily')"><span>☑</span><b data-i="daily">Daily</b></button>
<button data-page="settings" onclick="go('settings')"><span>⚙</span><b data-i="settings">Settings</b></button>
</nav></div>
<script>
const dict={
en:{home:"Your Life",daily:"Daily",task:"Task",journal:"Journal",memory:"Memory",settings:"Settings",yourLife:"Your Life, Your Time",birth:"Birthday",life:"Average lifespan (years)",elapsed:"Time lived",remaining:"Estimated time remaining",showRemainingAs:"Show remaining time as",showAll:"Show all",days:"Days",months:"Months",years:"Years",begin:"Begin Today",quote:"Small steps make big changes.",today:"Today's Tasks",progress:"Today's Progress",addTask:"Add Task",taskName:"Task name",category:"Category",study:"Study",health:"Health",lifeCat:"Life",custom:"Custom",save:"Save",cancel:"Cancel",write:"Write your day",feeling:"How are you feeling today?",grateful:"Today I'm grateful for...",happened:"What happened today?",tomorrow:"Tomorrow I want to...",title:"Title",content:"Your memory",addMemory:"Add Memory",noEntries:"Nothing saved for this date yet.",profile:"Profile",language:"Language",font:"Font size",small:"Small",medium:"Medium",large:"Large",xl:"Extra Large",appearance:"Appearance",light:"Light",dark:"Dark",reminders:"Reminders",dailyReminder:"Daily reminder",backup:"Data backup",export:"Export my data",import:"Import data",birthdayLife:"Birthday & Lifespan",name:"Name",saveSettings:"Save settings",delete:"Delete",edit:"Edit",saved:"Saved on this device",mood:"Mood",all:"All",chooseDate:"Choose date",noTask:"No tasks for this day.",note:"Your entries are stored in this browser on this device.",open:"Open",close:"Close",deleteConfirm:"Delete this item?",restore:"Import backup file",theme:"Theme",day:"Day"},
my:{home:"သင့်ဘဝ",daily:"နေ့စဉ်",task:"လုပ်စရာ",journal:"မှတ်တမ်း",memory:"အမှတ်တရ",settings:"ဆက်တင်",yourLife:"သင့်ဘဝ၊ သင့်အချိန်",birth:"မွေးနေ့",life:"ပျမ်းမျှသက်တမ်း (နှစ်)",elapsed:"ကုန်လွန်ခဲ့သောအချိန်",remaining:"ခန့်မှန်းကျန်ရှိချိန်",showRemainingAs:"ကျန်ရှိချိန်ကို ပြသရန်",showAll:"၃ မျိုးလုံးပြမယ်",days:"ရက်",months:"လ",years:"နှစ်",begin:"ယနေ့ကို စတင်မယ်",quote:"ခြေလှမ်းသေးသေးလေးတွေက အပြောင်းအလဲကြီးတွေ ဖြစ်စေတယ်။",today:"ဒီနေ့လုပ်စရာများ",progress:"ဒီနေ့ပြီးစီးမှု",addTask:"လုပ်စရာထည့်မယ်",taskName:"လုပ်စရာအမည်",category:"အမျိုးအစား",study:"စာလေ့လာရေး",health:"ကျန်းမာရေး",lifeCat:"ကိုယ်ရေးကိုယ်တာ",custom:"ကိုယ်ပိုင်",save:"သိမ်းမယ်",cancel:"မလုပ်တော့",write:"ဒီနေ့အကြောင်းရေးမယ်",feeling:"ဒီနေ့ ဘယ်လိုခံစားရလဲ။",grateful:"ဒီနေ့ ကျေးဇူးတင်မိတာ...",happened:"ဒီနေ့ ဘာတွေဖြစ်ခဲ့လဲ...",tomorrow:"မနက်ဖြန် လုပ်ချင်တာ...",title:"ခေါင်းစဉ်",content:"အမှတ်တရအကြောင်း",addMemory:"အမှတ်တရထည့်မယ်",noEntries:"ဒီရက်စွဲအတွက် သိမ်းထားတာ မရှိသေးပါ။",profile:"ကိုယ်ရေးအချက်အလက်",language:"ဘာသာစကား",font:"စာလုံးအရွယ်အစား",small:"ကျဉ်း",medium:"ပုံမှန်",large:"ကြီး",xl:"အလွန်ကြီး",appearance:"အသွင်အပြင်",light:"အလင်း",dark:"အမှောင်",reminders:"သတိပေးချက်",dailyReminder:"နေ့စဉ်သတိပေးချိန်",backup:"ဒေတာအရန်သိမ်း",export:"ဒေတာထုတ်ယူမယ်",import:"ဒေတာပြန်သွင်းမယ်",birthdayLife:"မွေးနေ့နှင့် သက်တမ်း",name:"အမည်",saveSettings:"ဆက်တင်သိမ်းမယ်",delete:"ဖျက်မယ်",edit:"ပြင်မယ်",saved:"ဒီဖုန်းရဲ့ browser ထဲမှာ သိမ်းထားပါတယ်",mood:"စိတ်ခံစားချက်",all:"အားလုံး",chooseDate:"ရက်စွဲရွေးပါ",noTask:"ဒီနေ့အတွက် လုပ်စရာမရှိသေးပါ။",note:"မှတ်တမ်းတွေကို ဒီဖုန်းရဲ့ browser ထဲမှာ သိမ်းထားပါတယ်။",open:"ဖွင့်မယ်",close:"ပိတ်မယ်",deleteConfirm:"ဒီအရာကို ဖျက်မှာ သေချာလား။",restore:"အရန်ဖိုင်ပြန်သွင်းမယ်",theme:"အရောင်ပုံစံ",day:"ရက်"},
zh:{home:"人生",daily:"每日",task:"任务",journal:"日记",memory:"回忆",settings:"设置",yourLife:"你的人生，你的时间",birth:"出生日期",life:"预期寿命（年）",elapsed:"已经度过",remaining:"预计剩余时间",showRemainingAs:"剩余时间显示方式",showAll:"全部显示",days:"天",months:"月",years:"年",begin:"开始今天",quote:"小小的步伐也能带来大大的改变。",today:"今日任务",progress:"今日进度",addTask:"添加任务",taskName:"任务名称",category:"类别",study:"学习",health:"健康",lifeCat:"生活",custom:"自定义",save:"保存",cancel:"取消",write:"记录今天",feeling:"今天感觉如何？",grateful:"今天值得感恩的是……",happened:"今天发生了什么？",tomorrow:"明天我想……",title:"标题",content:"回忆内容",addMemory:"添加回忆",noEntries:"这一天还没有保存内容。",profile:"个人资料",language:"语言",font:"字体大小",small:"小",medium:"中",large:"大",xl:"特大",appearance:"外观",light:"浅色",dark:"深色",reminders:"提醒",dailyReminder:"每日提醒",backup:"数据备份",export:"导出数据",import:"导入数据",birthdayLife:"生日与寿命",name:"名称",saveSettings:"保存设置",delete:"删除",edit:"编辑",saved:"已保存在此设备的浏览器中",mood:"心情",all:"全部",chooseDate:"选择日期",noTask:"这一天还没有任务。",note:"记录保存在此设备的浏览器中。",open:"打开",close:"关闭",deleteConfirm:"确定删除此项目吗？",restore:"导入备份文件",theme:"主题",day:"天"},
ja:{home:"人生",daily:"毎日",task:"タスク",journal:"日記",memory:"思い出",settings:"設定",yourLife:"あなたの人生、あなたの時間",birth:"誕生日",life:"平均寿命（年）",elapsed:"過ごした時間",remaining:"推定残り時間",showRemainingAs:"残り時間の表示方法",showAll:"すべて表示",days:"日",months:"か月",years:"年",begin:"今日を始める",quote:"小さな一歩が大きな変化を生みます。",today:"今日のタスク",progress:"今日の進捗",addTask:"タスクを追加",taskName:"タスク名",category:"カテゴリ",study:"勉強",health:"健康",lifeCat:"生活",custom:"カスタム",save:"保存",cancel:"キャンセル",write:"今日を書く",feeling:"今日はどんな気分ですか？",grateful:"今日感謝したこと…",happened:"今日あったこと…",tomorrow:"明日したいこと…",title:"タイトル",content:"思い出の内容",addMemory:"思い出を追加",noEntries:"この日の保存内容はありません。",profile:"プロフィール",language:"言語",font:"文字サイズ",small:"小",medium:"中",large:"大",xl:"特大",appearance:"外観",light:"ライト",dark:"ダーク",reminders:"リマインダー",dailyReminder:"毎日のリマインダー",backup:"データバックアップ",export:"データを書き出す",import:"データを読み込む",birthdayLife:"誕生日と寿命",name:"名前",saveSettings:"設定を保存",delete:"削除",edit:"編集",saved:"この端末のブラウザに保存されます",mood:"気分",all:"すべて",chooseDate:"日付を選択",noTask:"この日のタスクはありません。",note:"記録はこの端末のブラウザに保存されます。",open:"開く",close:"閉じる",deleteConfirm:"この項目を削除しますか？",restore:"バックアップを読み込む",theme:"テーマ",day:"日"}
};
const today=()=>new Date().toLocaleDateString('en-CA');
let data;try{data=JSON.parse(localStorage.getItem('myDailyData'))||{birth:'',life:75,name:'',lang:'my',font:16,theme:'light',tasks:{},journals:{},memories:[]}}catch(e){data={birth:'',life:75,name:'',lang:'my',font:16,theme:'light',tasks:{},journals:{},memories:[]}}
let page='home', dailyTab='task', selectedDate=today(), mood=3, editingTask=null;
function t(k){return (dict[data.lang]||dict.my)[k]||dict.en[k]||k}
function persist(){localStorage.setItem('myDailyData',JSON.stringify(data))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateInput(label=''){return `<div class="datebar"><label>${label}</label><input aria-label="${label}" type="date" value="${selectedDate}" onchange="selectedDate=this.value;render()"></div>`}
function headerTitle(title,sub=''){return `<div class="row between"><div><h1>${title}</h1>${sub?`<div class="muted">${sub}</div>`:''}</div></div>`}
function go(p){page=p;render()}
function getRemainingUnit(){return localStorage.getItem('myDailyRemainingUnit')||'days'}
function setRemainingUnit(unit){localStorage.setItem('myDailyRemainingUnit',unit);render()}
function remainingStats(c){const unit=getRemainingUnit();if(unit==='all')return stat(Math.floor(c.rem/365.2425),t('years'))+stat(Math.floor(c.rem/30.4375),t('months'))+stat(c.rem,t('days'));if(unit==='years')return stat((c.rem/365.2425).toFixed(1),t('years'));if(unit==='months')return stat(Math.floor(c.rem/30.4375),t('months'));return stat(c.rem,t('days'))}
function calc(){
 if(!data.birth)return null;let b=new Date(data.birth+'T12:00:00'),n=new Date();if(b>n)return null;
 let lived=Math.floor((n-b)/86400000), end=new Date(b);end.setFullYear(end.getFullYear(),end.getMonth(),end.getDate());end.setFullYear(end.getFullYear()+Number(data.life||75));
 let rem=Math.max(0,Math.ceil((end-n)/86400000));return {lived,rem,age:Math.floor(lived/365.2425),end}
}
function stat(n,label){return `<div class="stat"><b>${n}</b><span class="small">${label}</span></div>`}
function render(){
 document.documentElement.style.setProperty('--font',data.font+'px');
 if(data.theme==='dark'){document.documentElement.style.setProperty('--bg','#20291f');document.documentElement.style.setProperty('--paper','#2c3529');document.documentElement.style.setProperty('--sage','#394a36');document.documentElement.style.setProperty('--green','#9bb88b');document.documentElement.style.setProperty('--deep','#e0ebd6');document.documentElement.style.setProperty('--ink','#eef0e5');document.documentElement.style.setProperty('--line','#46513f');document.documentElement.style.setProperty('--muted','#b7c4ad')}else{document.documentElement.style.cssText+=';--bg:#f7f5e9;--paper:#fffdf5;--sage:#dfe8d4;--green:#456b43;--deep:#284a2d;--gold:#c9a44d;--ink:#314334;--line:#e4e4d2;--muted:#71816e'}
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page || (b.dataset.page==='daily' && ['task','journal','memory'].includes(page))));
 const v=document.getElementById('view');
 if(page==='home'){let c=calc();v.innerHTML=`<section class="hero"><div class="muted">${new Date().toLocaleDateString(data.lang==='my'?'my-MM':data.lang==='zh'?'zh-CN':data.lang==='ja'?'ja-JP':'en-US',{weekday:'long',year:'numeric',month:'short',day:'numeric'})}</div><h1>${t('yourLife')}</h1><p class="quote">🌿 ${t('quote')}</p><div class="card"><div class="settingsrow"><span>${t('birth')}</span><b>${data.birth||'—'}</b></div><div class="settingsrow"><span>${t('life')}</span><b>${data.life} ${t('years')}</b></div><button class="secondary" onclick="go('settings')">${t('birthdayLife')} ✎</button></div>${c?`<h3>${t('elapsed')}</h3><div class="grid3">${stat(c.age,t('years'))}${stat(Math.floor(c.lived/30.4375)%12,t('months'))}${stat(c.lived,t('days'))}</div><h3 style="margin-top:16px">${t('remaining')}</h3><div class="field"><label>${t('showRemainingAs')}</label><select id="remainingUnit" onchange="setRemainingUnit(this.value)"><option value="days" ${getRemainingUnit()==='days'?'selected':''}>${t('days')}</option><option value="months" ${getRemainingUnit()==='months'?'selected':''}>${t('months')}</option><option value="years" ${getRemainingUnit()==='years'?'selected':''}>${t('years')}</option><option value="all" ${getRemainingUnit()==='all'?'selected':''}>${t('showAll')}</option></select></div><div class="${getRemainingUnit()==='all'?'grid3':'stat-single'}">${remainingStats(c)}</div><div class="notice">🌻 ${t('note')}</div>`:`<div class="field"><label>${t('birth')}</label><input id="birthQuick" type="date" max="${today()}" value="${data.birth}"></div><button onclick="data.birth=document.getElementById('birthQuick').value;persist();render()">${t('save')}</button>`}<button style="width:100%;margin-top:14px" onclick="go('task')">${t('begin')} →</button></section>`}
 if(page==='daily'){v.innerHTML=`${headerTitle(t('daily'),t('chooseDate'))}<div class="tabs"><button class="${dailyTab==='task'?'active':''}" onclick="dailyTab='task';render()">☑ ${t('task')}</button><button class="${dailyTab==='journal'?'active':''}" onclick="dailyTab='journal';render()">▤ ${t('journal')}</button></div><div class="card"><p class="muted">${t('note')}</p><button style="width:100%;margin:5px 0" onclick="go(dailyTab)">${dailyTab==='task'?t('task'):t('journal')} →</button><div class="row"><button class="secondary" style="flex:1" onclick="go('task')">${t('task')}</button><button class="secondary" style="flex:1" onclick="go('journal')">${t('journal')}</button></div></div>`}
 if(page==='task'){let tasks=data.tasks[selectedDate]||[];let done=tasks.filter(x=>x.done).length;v.innerHTML=`${headerTitle(t('today'),t('progress')+': '+done+'/'+tasks.length)}<div class="card">${dateInput(t('chooseDate'))}<div class="progress" style="margin:12px 0"><div style="width:${tasks.length?done/tasks.length*100:0}%"></div></div><div class="muted">${tasks.length?Math.round(done/tasks.length*100):0}%</div><div id="tasks">${tasks.length?tasks.map((x,i)=>`<div class="task"><input type="checkbox" ${x.done?'checked':''} onchange="toggleTask(${i},this.checked)"><div class="tasktext"><b>${esc(x.name)}</b><br><span class="pill">${esc(t(x.cat)||x.cat)}</span></div><button class="ghost" onclick="editTask(${i})">✎</button><button class="ghost danger" onclick="deleteTask(${i})">×</button></div>`).join(''):`<div class="empty">${t('noTask')}</div>`}</div><button style="width:100%;margin-top:10px" onclick="taskForm()">＋ ${t('addTask')}</button></div><div id="taskForm"></div>`}
 if(page==='journal'){let j=data.journals[selectedDate]||{};v.innerHTML=`${headerTitle(t('journal'),t('saved'))}<div class="card">${dateInput(t('chooseDate'))}<div class="field"><label>${t('feeling')}</label><div class="mood">${['😞','😕','😐','🙂','😊'].map((m,i)=>`<button class="${(j.mood??mood)===i?'selected':''}" onclick="mood=${i};saveMood(${i})">${m}</button>`).join('')}</div></div><div class="journalpaper"><div class="field"><label>${t('grateful')}</label><textarea id="gratitude">${esc(j.gratitude||'')}</textarea></div><div class="field"><label>${t('happened')}</label><textarea id="happened">${esc(j.happened||'')}</textarea></div><div class="field"><label>${t('tomorrow')}</label><textarea id="tomorrow">${esc(j.tomorrow||'')}</textarea></div></div><button style="width:100%;margin-top:12px" onclick="saveJournal()">▣ ${t('save')}</button></div>`}
 if(page==='memory'){v.innerHTML=`${headerTitle(t('memory'),t('note'))}<div class="card"><button style="width:100%" onclick="memoryForm()">＋ ${t('addMemory')}</button><div id="memoryForm"></div></div><div id="memories">${[...data.memories].sort((a,b)=>b.date.localeCompare(a.date)).map((m,i)=>`<div class="card"><div class="row between"><div><b>${esc(m.title)}</b><div class="muted">${m.date}</div></div><button class="ghost danger" onclick="deleteMemory('${m.id}')">×</button></div><p>${esc(m.content).slice(0,180)}</p></div>`).join('')||`<div class="empty">${t('noEntries')}</div>`}</div>`}
 if(page==='settings'){v.innerHTML=`${headerTitle(t('settings'))}<div class="card"><h2>🌻 My Daily</h2><div class="row"><button class="secondary" style="flex:1" onclick="go('task')">☑ ${t('task')}</button><button class="secondary" style="flex:1" onclick="go('journal')">▤ ${t('journal')}</button><button class="secondary" style="flex:1" onclick="go('memory')">♡ ${t('memory')}</button></div><div class="field"><label>${t('name')}</label><input id="profileName" value="${esc(data.name)}" placeholder="${t('name')}"></div><div class="field"><label>${t('birthdayLife')}</label><label>${t('birth')}</label><input id="setBirth" type="date" max="${today()}" value="${data.birth}"></div><div class="field"><label>${t('life')}</label><input id="setLife" type="number" min="1" max="120" value="${data.life}"></div><div class="field"><label>${t('language')}</label><select id="lang"><option value="my" ${data.lang==='my'?'selected':''}>မြန်မာ</option><option value="en" ${data.lang==='en'?'selected':''}>English</option><option value="zh" ${data.lang==='zh'?'selected':''}>中文</option><option value="ja" ${data.lang==='ja'?'selected':''}>日本語</option></select></div><div class="field"><label>${t('font')}</label><select id="font"><option value="14" ${data.font===14?'selected':''}>${t('small')}</option><option value="16" ${data.font===16?'selected':''}>${t('medium')}</option><option value="18" ${data.font===18?'selected':''}>${t('large')}</option><option value="21" ${data.font===21?'selected':''}>${t('xl')}</option></select></div><div class="field"><label>${t('appearance')}</label><select id="theme"><option value="light" ${data.theme==='light'?'selected':''}>${t('light')}</option><option value="dark" ${data.theme==='dark'?'selected':''}>${t('dark')}</option></select></div><button style="width:100%" onclick="saveSettings()">${t('saveSettings')}</button></div><div class="card"><h3>${t('backup')}</h3><button class="secondary" style="width:100%;margin:5px 0" onclick="exportData()">${t('export')}</button><label class="small">${t('restore')}</label><input type="file" accept="application/json,.json" onchange="importData(event)"><p class="notice">${t('note')}</p></div>`}
}
function toggleTask(i,val){data.tasks[selectedDate][i].done=val;persist();render()}
function taskForm(i=null){editingTask=i;let old=i===null?{name:'',cat:'study'}:data.tasks[selectedDate][i];document.getElementById('taskForm').innerHTML=`<div class="card"><div class="field"><label>${t('taskName')}</label><input id="taskName" value="${esc(old.name)}"></div><div class="field"><label>${t('category')}</label><select id="taskCat"><option value="study">${t('study')}</option><option value="health">${t('health')}</option><option value="lifeCat">${t('lifeCat')}</option><option value="custom">${t('custom')}</option></select></div><div class="row"><button onclick="saveTask()">${t('save')}</button><button class="secondary" onclick="document.getElementById('taskForm').innerHTML=''">${t('cancel')}</button></div></div>`;document.getElementById('taskCat').value=old.cat}
function editTask(i){taskForm(i);document.getElementById('taskName').focus()}
function saveTask(){let name=document.getElementById('taskName').value.trim();if(!name)return;let cat=document.getElementById('taskCat').value;data.tasks[selectedDate]??=[];if(editingTask===null)data.tasks[selectedDate].push({name,cat,done:false});else data.tasks[selectedDate][editingTask]={...data.tasks[selectedDate][editingTask],name,cat};persist();render()}
function deleteTask(i){if(confirm(t('deleteConfirm'))){data.tasks[selectedDate].splice(i,1);persist();render()}}
function saveMood(i){data.journals[selectedDate]??={};data.journals[selectedDate].mood=i;persist();render()}
function saveJournal(){data.journals[selectedDate]={mood,gratitude:document.getElementById('gratitude').value,happened:document.getElementById('happened').value,tomorrow:document.getElementById('tomorrow').value};persist();alert(t('saved'))}
function memoryForm(){document.getElementById('memoryForm').innerHTML=`<div class="field"><label>${t('title')}</label><input id="memTitle"></div><div class="field"><label>${t('chooseDate')}</label><input id="memDate" type="date" value="${selectedDate}"></div><div class="field"><label>${t('content')}</label><textarea id="memContent"></textarea></div><button onclick="saveMemory()">${t('save')}</button>`}
function saveMemory(){let title=document.getElementById('memTitle').value.trim(),content=document.getElementById('memContent').value.trim(),date=document.getElementById('memDate').value||selectedDate;if(!title||!content)return;data.memories.push({id:Date.now().toString(),title,content,date});persist();render()}
function deleteMemory(id){if(confirm(t('deleteConfirm'))){data.memories=data.memories.filter(m=>m.id!==id);persist();render()}}
function saveSettings(){data.name=document.getElementById('profileName').value;data.birth=document.getElementById('setBirth').value;data.life=Math.min(120,Math.max(1,Number(document.getElementById('setLife').value)||75));data.lang=document.getElementById('lang').value;data.font=Number(document.getElementById('font').value);data.theme=document.getElementById('theme').value;persist();render()}
function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-daily-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.tasks||!x.journals)throw 0;data={...data,...x};persist();render();alert(t('saved'))}catch(_){alert('Invalid backup file')}};r.readAsText(f)}
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
